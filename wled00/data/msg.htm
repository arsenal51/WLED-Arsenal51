<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>Message · Arsenal51</title>
<!-- NOTE: this page is served through WLED's %MSG% template processor, which treats
     every %...% as a token. So all literal CSS percent signs are escaped as %% . -->
<style>
  @font-face{font-family:'Barlow';font-style:normal;font-weight:700;src:url('/Barlow-Bold.woff2') format('woff2');}
  :root{--ground:#06080b;--glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.08);--line:rgba(255,255,255,.10);--line-2:rgba(100,213,255,.28);--acc:#64d5ff;--acc-2:#4ab8e6;--glow:rgba(100,213,255,.42);--ink:#e8f4fa;--mut:rgba(232,244,250,.6);--font:'Barlow',-apple-system,'Segoe UI',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{visibility:visible}
  body{font-family:var(--font);background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.6}
  svg{display:block}
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #bg::before,#bg::after{content:"";position:fixed;border-radius:50%%;filter:blur(80px);opacity:.5}
  #bg::before{width:80vw;height:80vw;left:-30vw;top:-32vw;background:radial-gradient(circle,rgba(100,213,255,.2),transparent 66%%);animation:drift 22s ease-in-out infinite alternate}
  #bg::after{width:70vw;height:70vw;right:-25vw;bottom:-26vw;background:radial-gradient(circle,rgba(74,184,230,.15),transparent 68%%);animation:drift 26s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate3d(5vw,4vw,0) scale(1.14)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .card{position:relative;z-index:1;width:100%%;max-width:420px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:38px 30px 30px;backdrop-filter:blur(16px)}
  .mark{width:58px;height:58px;margin:0 auto 20px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(150deg,rgba(100,213,255,.22),rgba(100,213,255,.04));border:1px solid var(--line-2);box-shadow:0 0 24px rgba(100,213,255,.2),inset 0 0 16px rgba(100,213,255,.12)}
  .mark svg{width:28px;height:28px}
  h2{font-size:1.3rem;font-weight:800;line-height:1.3;color:var(--ink);margin-bottom:10px}
  .card{color:var(--mut);font-size:.92rem}
  a{color:var(--acc)}
  .bt{display:inline-block;font-family:var(--font);font-weight:700;font-size:.9rem;padding:13px 26px;margin-top:24px;border-radius:13px;border:1px solid transparent;background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#00161f;cursor:pointer;transition:.2s;text-decoration:none;box-shadow:0 6px 20px rgba(100,213,255,.28)}
  .bt:hover{filter:brightness(1.06)}
  form{margin:0;display:inline}
</style>
<script>
  function B(){ top.location.href = "../"; }   // the backend "Back" button -> dashboard
  function RS(){ window.location = "../settings"; }
  function RP(){ top.location.href = "../"; }
  // The backend injects a <button class="bt" onclick="B()">Back</button> for error
  // messages. Relabel it "Back to Controls" (it already routes to the dashboard via B()).
  addEventListener('DOMContentLoaded', function(){
    var b = document.querySelector('.bt'); if(b){ b.textContent = 'Back to Controls'; }
  });
</script>
</head>
<body>
<div id="bg"></div>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="17.5" r="1.7" style="fill:var(--acc);stroke:none"/><path d="M8 17.5a4 4 0 0 1 8 0" opacity=".95"/><path d="M5 17.5a7 7 0 0 1 14 0" opacity=".55"/><path d="M2 17.5a10 10 0 0 1 20 0" opacity=".28"/></svg></div>
  <h2>%MSG%</h2>
</div>
</body>
</html>
