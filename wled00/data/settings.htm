<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>Settings · Arsenal51</title>
<script>
  // load common.js (getLoc/getURL/loadJS), then init the conditional settings script
  (function loadFiles(){
    var l=document.createElement('script');l.src='common.js';
    l.onload=function(){try{getLoc();loadJS(getURL('/settings/s.js?p=0'),false);}catch(e){}};
    l.onerror=function(){setTimeout(loadFiles,100);};
    document.head.appendChild(l);
  })();
</script>
<style>
  @font-face{font-family:'Barlow';font-style:normal;font-weight:700;src:url('/Barlow-Bold.woff2') format('woff2');}
  :root{
    --ground:#06080b;--glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.10);--line-2:rgba(100,213,255,.28);
    --acc:#64d5ff;--acc-2:#4ab8e6;--glow:rgba(100,213,255,.42);
    --ink:#e8f4fa;--mut:rgba(232,244,250,.55);--mut-2:rgba(232,244,250,.34);
    --font:'Barlow',-apple-system,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:var(--font);background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  svg{display:block}
  .ic{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #bg::before,#bg::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:.55}
  #bg::before{width:90vw;height:90vw;left:-30vw;top:-34vw;background:radial-gradient(circle,rgba(100,213,255,.22),transparent 64%);animation:drift 22s ease-in-out infinite alternate}
  #bg::after{width:75vw;height:75vw;right:-26vw;bottom:-28vw;background:radial-gradient(circle,rgba(74,184,230,.16),transparent 66%);animation:drift 26s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate3d(5vw,4vw,0) scale(1.14)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:26px 20px 60px}

  header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .mark{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(100,213,255,.22),rgba(100,213,255,.04));
    border:1px solid var(--line-2);box-shadow:0 0 18px rgba(100,213,255,.18),inset 0 0 12px rgba(100,213,255,.1)}
  .mark svg{width:26px;height:26px;stroke:var(--acc);stroke-width:1.6;fill:none;stroke-linecap:round}
  .htext h1{font-size:1.4rem;font-weight:800;letter-spacing:.01em;line-height:1}
  .htext span{display:block;font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:var(--mut-2);margin-top:5px}
  .back{margin-left:auto;display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--glass);color:var(--ink);cursor:pointer;transition:.2s;font:700 .82rem var(--font);text-decoration:none;backdrop-filter:blur(12px)}
  .back:hover{border-color:var(--line-2);color:var(--acc)}
  .back svg{width:18px;height:18px}

  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  @media (min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}

  .scard{display:flex;align-items:center;gap:15px;padding:18px 17px;border-radius:18px;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(14px);cursor:pointer;transition:.22s;text-decoration:none;color:var(--ink)}
  .scard:hover{border-color:var(--line-2);background:var(--glass-2);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .scard .ti{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
    background:rgba(100,213,255,.1);color:var(--acc);border:1px solid var(--line-2)}
  .scard .ti svg{width:23px;height:23px}
  .scard .body{flex:1;min-width:0}
  .scard b{display:block;font-size:1rem;font-weight:800;letter-spacing:.01em}
  .scard small{display:block;color:var(--mut);font-size:.72rem;margin-top:2px}
  .scard .chev{color:var(--mut-2);flex-shrink:0;transition:.2s}
  .scard:hover .chev{color:var(--acc);transform:translateX(2px)}
  .scard .chev svg{width:20px;height:20px}

  footer{margin-top:34px;text-align:center;color:var(--mut-2);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">
  <header>
    <div class="mark" id="mk"></div>
    <div class="htext"><h1>Settings</h1><span>Arsenal51</span></div>
    <a class="back" onclick="go('/')"><span data-i="back"></span>Controls</a>
  </header>

  <div class="grid">
    <a class="scard" onclick="go('/settings/wifi')"><span class="ti" data-i="wifi"></span><span class="body"><b>WiFi &amp; Network</b><small>Connections, IP, access point</small></span><span class="chev" data-i="chev"></span></a>
    <a class="scard" style="display:none" onclick="go('/settings/leds')"><span class="ti" data-i="led"></span><span class="body"><b>LED &amp; Hardware</b><small>Strip type, count, pins, power</small></span><span class="chev" data-i="chev"></span></a>
    <a class="scard" onclick="go('/settings/ui')"><span class="ti" data-i="ui"></span><span class="body"><b>User Interface</b><small>Theme, name, layout</small></span><span class="chev" data-i="chev"></span></a>
    <a class="scard" onclick="go('/settings/sync')"><span class="ti" data-i="sync"></span><span class="body"><b>Smart Home</b><small>Alexa, MQTT &amp; Home Assistant</small></span><span class="chev" data-i="chev"></span></a>
    <a class="scard" onclick="go('/settings/sec')"><span class="ti" data-i="update"></span><span class="body"><b>Security &amp; Updates</b><small>OTA, backup, factory reset</small></span><span class="chev" data-i="chev"></span></a>
  </div>

  <footer>Arsenal51 Control</footer>
</div>

<script>
(function(){
  var P='<svg class="ic" viewBox="0 0 24 24">',E='</svg>';
  var ICON={
    back:P+'<path d="M15 18l-6-6 6-6"/>'+E,
    chev:P+'<path d="M9 6l6 6-6 6"/>'+E,
    wifi:P+'<path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>'+E,
    led:P+'<rect x="4" y="9" width="16" height="6" rx="3"/><circle cx="8" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.1" fill="currentColor" stroke="none"/>'+E,
    grid:P+'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'+E,
    ui:P+'<path d="M4 8h9M17 8h3M4 16h11M19 16h1"/><circle cx="15" cy="8" r="2.2"/><circle cx="17" cy="16" r="2.2"/>'+E,
    plug:P+'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>'+E,
    sync:P+'<path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'+E,
    clock:P+'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2.5"/>'+E,
    puzzle:P+'<path d="M10 3a2 2 0 0 1 4 0v1h3a1 1 0 0 1 1 1v3h1a2 2 0 0 1 0 4h-1v3a1 1 0 0 1-1 1h-3v1a2 2 0 0 1-4 0v-1H7a1 1 0 0 1-1-1v-3H5a2 2 0 0 1 0-4h1V5a1 1 0 0 1 1-1h3z"/>'+E,
    update:P+'<path d="M12 3v11M8 10l4 4 4-4"/><path d="M5 19h14"/>'+E,
    mark:'<svg viewBox="0 0 24 24"><circle cx="12" cy="18.5" r="1.8" style="fill:var(--acc);stroke:none"/><path d="M7 18.5a5 5 0 0 1 10 0" opacity=".9"/><path d="M3.5 18.5a8.5 8.5 0 0 1 17 0" opacity=".55"/><path d="M.5 18.5a11.5 11.5 0 0 1 23 0" opacity=".28"/></svg>'
  };
  document.querySelectorAll('[data-i]').forEach(function(el){var n=el.getAttribute('data-i');if(ICON[n])el.innerHTML=ICON[n];});
  document.getElementById('mk').innerHTML=ICON.mark;
})();
function go(p){window.location.href=(typeof getURL==='function'?getURL(p):p);}
</script>
</body>
</html>
