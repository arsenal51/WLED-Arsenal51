<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>Welcome · Orbiter</title>
<style>
  @font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url('/Barlow-Bold.woff2') format('woff2')}
  :root{
    --ground:#06080b;--glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.10);--line-2:rgba(100,213,255,.28);
    --acc:#64d5ff;--acc-2:#4ab8e6;--glow:rgba(100,213,255,.42);--ink-btn:#00161f;
    --ink:#e8f4fa;--mut:rgba(232,244,250,.62);--mut-2:rgba(232,244,250,.36);
    --font:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow-x:hidden}
  svg{display:block}
  a{color:var(--acc);text-decoration:none}

  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #bg::before,#bg::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.55}
  #bg::before{width:75vw;height:75vw;left:-26vw;top:-30vw;background:radial-gradient(circle,rgba(100,213,255,.20),transparent 65%);animation:drift 24s ease-in-out infinite alternate}
  #bg::after{width:66vw;height:66vw;right:-24vw;bottom:-28vw;background:radial-gradient(circle,rgba(74,184,230,.15),transparent 66%);animation:drift 30s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate3d(4vw,4vw,0) scale(1.12)}}
  #particleCanvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;opacity:.85}

  .wrap{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}

  .brand{display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .logo{width:220px;max-width:68vw;filter:drop-shadow(0 0 24px rgba(100,213,255,.30))}
  .brand .badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;
    background:rgba(100,213,255,.1);border:1px solid var(--line-2);color:var(--acc);font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .brand .badge .pip{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:blink 2s ease-in-out infinite}
  h1{font-size:1.9rem;font-weight:800;letter-spacing:-.015em;line-height:1.05}
  .lead{font-size:.98rem;color:var(--mut);max-width:34ch;line-height:1.5}

  .card{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:22px 20px;
    backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:left;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .12s both}
  .note{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:14px;
    background:rgba(100,213,255,.06);border:1px solid var(--line-2);margin-bottom:16px}
  .note svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;stroke:var(--acc);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .note p{font-size:.82rem;color:var(--ink);line-height:1.45}
  .note b{color:var(--acc)}

  .act{display:flex;align-items:center;gap:13px;width:100%;font-family:var(--font);font-weight:800;font-size:.98rem;
    padding:15px 16px;border-radius:15px;cursor:pointer;transition:filter .18s,background .18s,border-color .18s,transform .12s;text-align:left}
  .act .ai{width:38px;height:38px;flex-shrink:0;border-radius:11px;display:grid;place-items:center}
  .act .ai svg{width:19px;height:19px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .act .at{flex:1}
  .act .at small{display:block;font-weight:700;font-size:.72rem;margin-top:2px;opacity:.75}
  .act .chev{flex-shrink:0}
  .act .chev svg{width:18px;height:18px;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .act.primary{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:var(--ink-btn);border:1px solid transparent;box-shadow:0 8px 26px rgba(100,213,255,.26);margin-bottom:10px}
  .act.primary .ai{background:rgba(0,22,31,.16)}
  .act.primary svg{stroke:var(--ink-btn)}
  .act.primary:hover{filter:brightness(1.07)}
  .act.ghost{background:var(--glass-2);color:var(--ink);border:1px solid var(--line)}
  .act.ghost .ai{background:rgba(100,213,255,.1);color:var(--acc)}
  .act.ghost svg{stroke:currentColor}
  .act.ghost .ai svg{stroke:var(--acc)}
  .act.ghost:hover{border-color:var(--line-2);background:rgba(100,213,255,.08)}
  .act:active{transform:translateY(1px)}

  .foot{font-size:.8rem;color:var(--mut-2);animation:rise .7s cubic-bezier(.2,.8,.2,1) .24s both}
  .foot a{color:var(--mut);text-decoration:underline;text-underline-offset:2px}
  .foot a:hover{color:var(--acc)}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#particleCanvas{display:none}}
  @media (max-width:480px){h1{font-size:1.6rem}.card{padding:20px 16px}}
</style>
</head>

<script>
(function(){
  var canvas=document.getElementById('particleCanvas'),ctx=canvas.getContext('2d');
  var particles=[],mx=-999,my=-999,t=0;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
  function P(big){this.big=big;this.reset();}
  P.prototype.reset=function(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;
    this.s=this.big?Math.random()*2+1.5:Math.random()*1.4+.4;
    this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.o=Math.random()*.4+.2;this.ph=Math.random()*Math.PI*2;};
  P.prototype.step=function(){this.x+=this.vx+Math.sin(t*.001+this.ph)*.15;this.y+=this.vy+Math.cos(t*.001+this.ph)*.15;
    var dx=mx-this.x,dy=my-this.y,d=Math.hypot(dx,dy);
    if(d<150){var f=(150-d)/150;this.vx+=(dx/d)*f*.015;this.vy+=(dy/d)*f*.015;
      this.vx=Math.max(-1.6,Math.min(1.6,this.vx));this.vy=Math.max(-1.6,Math.min(1.6,this.vy));}else{this.vx*=.99;this.vy*=.99;}
    if(this.x<-40)this.x=canvas.width+40;if(this.x>canvas.width+40)this.x=-40;
    if(this.y<-40)this.y=canvas.height+40;if(this.y>canvas.height+40)this.y=-40;};
  P.prototype.draw=function(){ctx.globalAlpha=this.o;ctx.fillStyle=this.big?'#64D5FF':'#7AE1FF';
    ctx.shadowBlur=this.big?12:6;ctx.shadowColor='#64D5FF';ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,7);ctx.fill();ctx.shadowBlur=0;};
  function build(){var n=Math.min(40,Math.max(16,Math.floor(innerWidth*innerHeight/26000)));particles=[];for(var i=0;i<n;i++)particles.push(new P(i<n*.22));}
  function links(){ctx.strokeStyle='#64D5FF';ctx.lineWidth=.5;
    for(var i=0;i<particles.length;i++)for(var j=i+1;j<particles.length;j++){var a=particles[i],b=particles[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<140){ctx.globalAlpha=(1-d/140)*.22;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
  function loop(){t++;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;links();particles.forEach(function(p){p.step();p.draw();});requestAnimationFrame(loop);}
  resize();build();loop();
  addEventListener('resize',resize);
  addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
  addEventListener('touchmove',function(e){if(e.touches[0]){mx=e.touches[0].clientX;my=e.touches[0].clientY;}},{passive:true});
})();
</script>
